<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CollabOS - Create Account</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        inter: ["Inter", "sans-serif"]
                    },
                    colors: {
                        background: "#111318",
                        surface: "#1a1c20",
                        card: "#1f2126",
                        primary: "#C0C1FF",
                        primaryDark: "#8083ff",
                        borderColor: "#474954",
                        textMuted: "#A7A9B8",
                        secondary: "#7BD0FF"
                    }
                }
            }
        }
    </script>

    <style>
        body {font-family: Inter, sans-serif;}

        .grid-bg {
            background-image:
                linear-gradient(rgba(255, 255, 255, .05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, .05) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        .glass {
            backdrop-filter: blur(14px);
            background: rgba(26, 28, 32, .55);
        }
    </style>
</head>

<body class="bg-background text-white">

<div class="min-h-screen flex flex-col lg:flex-row">
    <section class="hidden lg:flex lg:w-1/2 relative overflow-hidden bg-[#0d0f14] grid-bg p-12 xl:p-16 flex-col justify-between">
        <div class="flex items-center gap-3 z-10">
            <img src="../Assets/SVGs/logo.svg" alt="CollabOS Logo" class="h-10 w-auto">
            <h2 class="text-3xl font-semibold">CollabOS</h2>
        </div>

        <div class="relative z-10 my-8">
            <div class="relative rounded-2xl overflow-hidden border border-borderColor/60 shadow-2xl bg-card/60 glass">
                <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1200&q=80" 
                     alt="CollabOS Platform Preview" 
                     class="w-full h-56 xl:h-64 object-cover object-top opacity-90 hover:scale-105 transition duration-500">
                <div class="absolute inset-0 bg-gradient-to-t from-[#0d0f14] via-transparent to-transparent"></div>
            </div>
        </div>

        <div class="relative z-10 max-w-xl">
            <h1 class="text-4xl xl:text-5xl leading-tight font-semibold">Join the platform built for engineering velocity.</h1>
            <p class="mt-4 text-lg text-textMuted leading-relaxed">Create your workspace in seconds, invite your engineering team, and accelerate your development lifecycle.</p>
        </div>

        <div class="absolute -bottom-40 -right-24 h-[450px] w-[450px] rounded-full bg-indigo-500/10 blur-3xl"></div>

    </section>

    <section class="w-full lg:w-1/2 flex justify-center items-center bg-background px-6 py-10">
        <div class="w-full max-w-md">
            <div class="lg:hidden flex justify-center items-center gap-3 mb-10">
                <span class="material-symbols-outlined text-primary text-4xl">dashboard_customize</span>
                <h2 class="text-3xl font-semibold">CollabOS</h2>
            </div>

            <h1 class="text-4xl font-semibold">Create account</h1>

            <div class="flex mt-10 border-b border-borderColor">
                <button id="signinTab" class="flex-1 py-4 text-sm uppercase tracking-wider font-semibold text-textMuted hover:text-white transition">Sign In</button>
                <button id="signupTab" class="flex-1 py-4 text-sm uppercase tracking-wider font-semibold border-b-2 border-primary text-primary">Create Account</button>
            </div>

            <form id="signupForm" class="mt-8 space-y-5">
                <div>
                    <label for="fullName" class="block text-xs uppercase tracking-widest text-textMuted mb-2">Full Name</label>
                    <input id="fullName" type="text" placeholder="Alex Mercer"
                        class="w-full bg-card border border-borderColor rounded-lg px-4 py-3 outline-none focus:border-primary focus:ring-2 focus:ring-primary/30 transition placeholder:text-gray-500">
                </div>

                <div>
                    <label for="email" class="block text-xs uppercase tracking-widest text-textMuted mb-2">Work Email Address</label>
                    <input id="email" type="email" placeholder="alex@company.com"
                        class="w-full bg-card border border-borderColor rounded-lg px-4 py-3 outline-none focus:border-primary focus:ring-2 focus:ring-primary/30 transition placeholder:text-gray-500">
                </div>

                <div>
                    <label for="password" class="block text-xs uppercase tracking-widest text-textMuted mb-2">Password</label>
                    <div class="relative">
                        <input id="password" type="password" placeholder="Minimum 8 characters"
                            class="w-full bg-card border border-borderColor rounded-lg px-4 py-3 pr-12 outline-none focus:border-primary focus:ring-2 focus:ring-primary/30 transition">
                        <button type="button" id="togglePassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition">
                            <span class="material-symbols-outlined">visibility_off</span>
                        </button>
                    </div>
                </div>

                <div class="flex items-start gap-3 pt-1">
                    <input id="terms" type="checkbox"
                        class="h-4 w-4 rounded border-borderColor bg-card text-primary focus:ring-primary mt-1">
                    <label for="terms" class="text-sm text-textMuted leading-normal">
                        I agree to the <a href="#" class="text-primary hover:underline">Terms of Service</a> and <a href="#" class="text-primary hover:underline">Privacy Policy</a>.
                    </label>
                </div>

                <p id="errorMessage" class="hidden text-red-400 text-sm">Please fill out all required fields.</p>

                <button id="signupBtn" type="submit"
                    class="w-full bg-primary text-black font-semibold rounded-lg py-3.5 hover:bg-primaryDark hover:text-white transition-all duration-200 active:scale-95">
                    <span class="flex justify-center items-center gap-2">
                        Create Account
                        <span class="material-symbols-outlined text-lg">arrow_forward</span>
                    </span>
                </button>
            </form>

            <div class="flex items-center my-8">
                <div class="flex-1 border-t border-borderColor"></div>
                <span class="px-4 text-xs uppercase tracking-widest text-textMuted">Or sign up with</span>
                <div class="flex-1 border-t border-borderColor"></div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button class="flex items-center justify-center gap-2 border border-borderColor rounded-lg py-3 hover:bg-card transition">
                    <span class="material-symbols-outlined">code</span>GitHub
                </button>
                <button class="flex items-center justify-center gap-2 border border-borderColor rounded-lg py-3 hover:bg-card transition">
                    <span class="material-symbols-outlined">mail</span>Google
                </button>
            </div>
        </div>
    </section>
</div>
<script src="..\js\signup.js"></script>
</body>
</html>
