<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CollabOS · Messages</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@450&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          background: "#111318",
          surface: "#111318",
          "surface-container-low": "#1a1c20",
          "surface-container": "#1e2024",
          "surface-container-high": "#282a2e",
          "surface-container-highest": "#333539",
          "surface-variant": "#333539",
          "on-surface": "#e2e2e8",
          "on-surface-variant": "#c7c4d7",
          outline: "#908fa0",
          "outline-variant": "#464554",
          primary: "#c0c1ff",
          "on-primary": "#1000a9",
          "primary-container": "#8083ff",
          secondary: "#7bd0ff",
          "secondary-container": "#00a6e0",
          "on-secondary-container": "#00374d",
          error: "#ffb4ab",
        },
        fontFamily: {
          sans: ["Inter", "sans-serif"],
          mono: ["JetBrains Mono", "monospace"],
        },
      },
    },
  };
</script>
<style>
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #464554; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #908fa0; }
  .avatar {
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; color: #111318;
  }
</style>
</head>
<body class="bg-background text-on-surface font-sans text-sm h-screen flex overflow-hidden">

<!-- ============ LEFT NAVBAR (unchanged structure, space left for more links) ============ -->
<nav class="bg-surface-container-low text-primary h-screen w-64 border-r border-outline-variant flex flex-col py-6 px-4 shrink-0">
  <div class="flex items-center gap-2 mb-8">
    <div class="w-8 h-8 rounded bg-primary flex items-center justify-center text-on-primary font-bold text-lg">C</div>
    <div>
      <h1 class="font-bold text-on-surface leading-tight">CollabOS</h1>
      <p class="font-mono text-[11px] text-on-surface-variant">Engineering Team</p>
    </div>
  </div>

  <a href="dashboard.html" class="w-full bg-primary text-on-primary font-bold py-2 rounded-lg mb-6 hover:opacity-90 transition-opacity flex items-center justify-center gap-1">
    <span class="material-symbols-outlined text-[18px]">dashboard</span> Dashboard
  </a>

  <!-- Existing nav items -->
  <div class="space-y-1">
    <a class="flex items-center gap-3 px-3 py-2 text-on-surface-variant hover:bg-surface-variant hover:text-on-surface rounded-lg transition-colors" href="dashboard.html">
      <span class="material-symbols-outlined text-[20px]">dashboard</span> Overview
    </a>
    <a class="flex items-center gap-3 px-3 py-2 text-on-surface-variant hover:bg-surface-variant hover:text-on-surface rounded-lg transition-colors" href="#">
      <span class="material-symbols-outlined text-[20px]">assignment_ind</span> My Work
    </a>
    <a class="flex items-center gap-3 px-3 py-2 text-on-surface-variant hover:bg-surface-variant hover:text-on-surface rounded-lg transition-colors" href="#">
      <span class="material-symbols-outlined text-[20px]">account_tree</span> Projects
    </a>
    <a class="flex items-center gap-3 px-3 py-2 bg-secondary-container text-on-secondary-container rounded-lg font-bold" href="#">
      <span class="material-symbols-outlined text-[20px]" style="font-variation-settings:'FILL' 1;">chat</span> Messages
    </a>
  </div>

  <div class="flex-1 my-4"></div>
  <a class="flex items-center gap-3 px-3 py-2 text-on-surface-variant hover:bg-surface-variant hover:text-on-surface rounded-lg transition-colors" href="analytics.html"><span class="material-symbols-outlined text-[20px]">analytics</span> Analytics</a>

  <div class="pt-4 border-t border-outline-variant space-y-1">
    <a class="flex items-center gap-3 px-3 py-2 text-on-surface-variant hover:bg-surface-variant hover:text-on-surface rounded-lg transition-colors" href="settings.html">
      <span class="material-symbols-outlined text-[20px]">settings</span> Settings
    </a>
  </div>
</nav>

<!-- ============ MAIN ============ -->
<main class="flex-1 flex overflow-hidden">

  <!-- Channel / DM list -->
  <aside class="w-64 bg-surface-container border-r border-outline-variant flex flex-col shrink-0">
    <div class="p-4 border-b border-outline-variant">
      <h2 class="font-bold text-base">Communications</h2>
    </div>
    <div class="flex-1 overflow-y-auto p-2 space-y-6">
      <div>
        <p class="px-2 py-1 text-[11px] font-bold uppercase tracking-wider text-on-surface-variant">Channels</p>
        <ul id="channel-list" class="space-y-0.5"></ul>
      </div>
      <div>
        <p class="px-2 py-1 text-[11px] font-bold uppercase tracking-wider text-on-surface-variant">Direct Messages</p>
        <ul id="dm-list" class="space-y-0.5"></ul>
      </div>
    </div>
  </aside>

  <!-- Chat -->
  <section class="flex-1 flex flex-col min-w-0">
    <header class="h-14 px-6 border-b border-outline-variant flex items-center justify-between shrink-0">
      <div class="flex items-center gap-2">
        <span id="chat-icon" class="text-on-surface-variant text-lg">#</span>
        <h2 id="chat-title" class="font-bold text-base"></h2>
      </div>
    </header>

    <div id="message-feed" class="flex-1 overflow-y-auto p-6 space-y-5"></div>

    <div class="p-4">
      <div class="border border-outline-variant rounded-lg bg-surface-container-low focus-within:border-primary transition-colors">
        <textarea id="message-input" class="w-full bg-transparent border-none p-3 text-on-surface resize-none focus:ring-0 focus:outline-none" placeholder="Message..." rows="2"></textarea>
        <div class="flex items-center justify-end p-2 bg-surface-container border-t border-outline-variant rounded-b-lg">
          <button id="send-btn" class="bg-primary text-on-primary px-4 py-1.5 rounded font-bold text-sm hover:opacity-90 transition-opacity flex items-center gap-1">
            Send <span class="material-symbols-outlined text-[18px]">send</span>
          </button>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
  // ---------- Data ----------
  const activeUser = JSON.parse(localStorage.getItem("loggedInUser") || "null");
  if (!activeUser?.email) window.location.replace("login.html");
  const CHANNELS = ["engineering", "frontend", "backend", "random"];
  const DMS = (JSON.parse(localStorage.getItem("users") || "[]")).filter(user => user.email !== activeUser?.email).map(user => user.fullName);
  const STORAGE_KEY = "collabos_messages_v1";
  const ME = activeUser?.fullName || "You";

  const SEED = {
    "engineering": [
      { user: "Ankit", text: "Deployed the new API endpoints to staging. Can someone take a look?", time: "10:45 AM" },
      { user: "Neha", text: "Seeing a weird race condition in the auth flow, looking into it now.", time: "10:32 AM" },
    ],
    "frontend": [
      { user: "Neha", text: "Pushed the new dashboard layout, would love a review.", time: "9:15 AM" },
    ],
    "backend": [
      { user: "Ankit", text: "Migrating the users table tonight, expect a short downtime.", time: "8:50 AM" },
    ],
    "random": [
      { user: "Rahul", text: "Anyone up for coffee later?", time: "9:40 AM" },
    ],
    "dm:Piyush": [
      { user: "Piyush", text: "Hey, got a sec to review my PR?", time: "11:02 AM" },
    ],
    "dm:Pulkit": [
      { user: "Pulkit", text: "Sent over the design mocks, take a look when free.", time: "Yesterday" },
    ],
    "dm:Parv": [],
    "dm:Anjali": [
      { user: "Anjali", text: "Standup moved to 10:30 tomorrow.", time: "Yesterday" },
    ],
  };

  function loadStore() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { console.error("Failed to read storage", e); }
    const seeded = JSON.parse(JSON.stringify(SEED));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded));
    return seeded;
  }

  function saveStore(store) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
    } catch (e) { console.error("Failed to save storage", e); }
  }

  let store = loadStore();
  let activeKey = "engineering"; // channel name or "dm:Name"

  const initials = (name) => name.slice(0, 2).toUpperCase();
  const colorFor = (name) => {
    const palette = ["#c0c1ff", "#7bd0ff", "#ffb783", "#8ee6a1", "#ff9bd2"];
    let hash = 0;
    for (const ch of name) hash = ch.charCodeAt(0) + ((hash << 5) - hash);
    return palette[Math.abs(hash) % palette.length];
  };

  function avatarEl(name, size = "w-9 h-9") {
    const div = document.createElement("div");
    div.className = `avatar rounded ${size}`;
    div.style.background = colorFor(name);
    div.textContent = initials(name);
    return div;
  }

  // ---------- Sidebar rendering ----------
  function renderChannelList() {
    const ul = document.getElementById("channel-list");
    ul.innerHTML = "";
    CHANNELS.forEach((ch) => {
      const li = document.createElement("li");
      const active = activeKey === ch;
      li.innerHTML = `
        <button data-key="${ch}" class="channel-btn w-full flex items-center gap-2 px-2 py-1.5 rounded text-left transition-colors ${
          active
            ? "bg-primary-container/20 text-primary border border-primary-container/30"
            : "text-on-surface-variant hover:bg-surface-variant hover:text-on-surface"
        }">
          <span class="font-mono opacity-60">#</span>
          <span class="${active ? "font-bold" : ""}">${ch}</span>
        </button>`;
      ul.appendChild(li);
    });
  }

  function renderDmList() {
    const ul = document.getElementById("dm-list");
    ul.innerHTML = "";
    DMS.forEach((name) => {
      const key = `dm:${name}`;
      const active = activeKey === key;
      const li = document.createElement("li");
      li.innerHTML = `
        <button data-key="${key}" class="dm-btn w-full flex items-center gap-2 px-2 py-1.5 rounded text-left transition-colors ${
          active
            ? "bg-primary-container/20 text-primary border border-primary-container/30"
            : "text-on-surface-variant hover:bg-surface-variant hover:text-on-surface"
        }">
        </button>`;
      const btn = li.querySelector("button");
      const av = avatarEl(name, "w-6 h-6");
      av.classList.add("rounded-full", "text-[10px]", "shrink-0");
      btn.appendChild(av);
      const span = document.createElement("span");
      span.className = active ? "font-bold" : "";
      span.textContent = name;
      btn.appendChild(span);
      ul.appendChild(li);
    });
  }

  // ---------- Chat rendering ----------
  function renderChat() {
    const isDm = activeKey.startsWith("dm:");
    document.getElementById("chat-icon").textContent = isDm ? "" : "#";
    document.getElementById("chat-title").textContent = isDm ? activeKey.slice(3) : activeKey;

    const feed = document.getElementById("message-feed");
    feed.innerHTML = "";
    const msgs = store[activeKey] || [];

    if (msgs.length === 0) {
      const empty = document.createElement("div");
      empty.className = "text-on-surface-variant text-center mt-10";
      empty.textContent = "No messages yet — say hi.";
      feed.appendChild(empty);
    }

    msgs.forEach((m) => {
      const row = document.createElement("div");
      row.className = "flex gap-3";
      const av = avatarEl(m.user);
      row.appendChild(av);

      const body = document.createElement("div");
      body.className = "flex-1 min-w-0";
      body.innerHTML = `
        <div class="flex items-baseline gap-2 mb-0.5">
          <span class="font-bold text-on-surface">${m.user}</span>
          <span class="font-mono text-[11px] text-on-surface-variant">${m.time}</span>
        </div>
        <div class="text-on-surface break-words"></div>`;
      body.querySelector("div.text-on-surface.break-words").textContent = m.text;
      row.appendChild(body);
      feed.appendChild(row);
    });

    feed.scrollTop = feed.scrollHeight;
  }

  function setActive(key) {
    activeKey = key;
    renderChannelList();
    renderDmList();
    renderChat();
  }

  // ---------- Sending ----------
  function sendMessage() {
    const input = document.getElementById("message-input");
    const text = input.value.trim();
    if (!text) return;

    const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    if (!store[activeKey]) store[activeKey] = [];
    store[activeKey].push({ user: ME, text, time });
    saveStore(store);
    input.value = "";
    renderChat();
  }

  document.getElementById("send-btn").addEventListener("click", sendMessage);
  document.getElementById("message-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  document.addEventListener("click", (e) => {
    const btn = e.target.closest(".channel-btn, .dm-btn");
    if (btn) setActive(btn.dataset.key);
  });

  // ---------- Init ----------
  renderChannelList();
  renderDmList();
  renderChat();
</script>
</body>
</html>
