<!-- ============ MAIN ============ -->
<main class="flex-1 flex overflow-hidden">

  <!-- Channel / DM list -->
  <aside class="w-64 bg-surface-container border-r border-outline-variant flex flex-col shrink-0">
    <div class="p-4 border-b border-outline-variant">
      <h2 class="font-bold text-base">Communications</h2>
    </div>
    <div class="flex-1 overflow-y-auto p-2 space-y-6">
      <div>
        <p class="px-2 py-1 text-[11px] font-bold uppercase tracking-wider text-on-surface-variant">Channels</p>
        <ul id="channel-list" class="space-y-0.5"></ul>
      </div>
      <div>
        <p class="px-2 py-1 text-[11px] font-bold uppercase tracking-wider text-on-surface-variant">Direct Messages</p>
        <ul id="dm-list" class="space-y-0.5"></ul>
      </div>
    </div>
  </aside>

  <!-- Chat -->
  <section class="flex-1 flex flex-col min-w-0">
    <header class="h-14 px-6 border-b border-outline-variant flex items-center justify-between shrink-0">
      <div class="flex items-center gap-2">
        <span id="chat-icon" class="text-on-surface-variant text-lg">#</span>
        <h2 id="chat-title" class="font-bold text-base"></h2>
      </div>
    </header>

    <div id="message-feed" class="flex-1 overflow-y-auto p-6 space-y-5"></div>

    <div class="p-4">
      <div class="border border-outline-variant rounded-lg bg-surface-container-low focus-within:border-primary transition-colors">
        <textarea id="message-input" class="w-full bg-transparent border-none p-3 text-on-surface resize-none focus:ring-0 focus:outline-none" placeholder="Message..." rows="2"></textarea>
        <div class="flex items-center justify-end p-2 bg-surface-container border-t border-outline-variant rounded-b-lg">
          <button id="send-btn" class="bg-primary text-on-primary px-4 py-1.5 rounded font-bold text-sm hover:opacity-90 transition-opacity flex items-center gap-1">
            Send <span class="material-symbols-outlined text-[18px]">send</span>
          </button>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
  // ---------- Data ----------
  const activeUser = JSON.parse(localStorage.getItem("loggedInUser") || "null");
  if (!activeUser?.email) window.location.replace("login.html");
  const CHANNELS = ["engineering", "frontend", "backend", "random"];
  const DMS = (JSON.parse(localStorage.getItem("users") || "[]")).filter(user => user.email !== activeUser?.email).map(user => user.fullName);
  const STORAGE_KEY = "collabos_messages_v1";
  const ME = activeUser?.fullName || "You";

  
  function loadStore() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { console.error("Failed to read storage", e); }
    const seeded = JSON.parse(JSON.stringify(SEED));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded));
    return seeded;
  }

  function saveStore(store) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
    } catch (e) { console.error("Failed to save storage", e); }
  }

  let store = loadStore();
  let activeKey = "engineering"; // channel name or "dm:Name"

  const initials = (name) => name.slice(0, 2).toUpperCase();
  const colorFor = (name) => {
    const palette = ["#c0c1ff", "#7bd0ff", "#ffb783", "#8ee6a1", "#ff9bd2"];
    let hash = 0;
    for (const ch of name) hash = ch.charCodeAt(0) + ((hash << 5) - hash);
    return palette[Math.abs(hash) % palette.length];
  };

  function avatarEl(name, size = "w-9 h-9") {
    const div = document.createElement("div");
    div.className = `avatar rounded ${size}`;
    div.style.background = colorFor(name);
    div.textContent = initials(name);
    return div;
  }

  // ---------- Sidebar rendering ----------
  function renderChannelList() {
    const ul = document.getElementById("channel-list");
    ul.innerHTML = "";
    CHANNELS.forEach((ch) => {
      const li = document.createElement("li");
      const active = activeKey === ch;
      li.innerHTML = `
        <button data-key="${ch}" class="channel-btn w-full flex items-center gap-2 px-2 py-1.5 rounded text-left transition-colors ${
          active
            ? "bg-primary-container/20 text-primary border border-primary-container/30"
            : "text-on-surface-variant hover:bg-surface-variant hover:text-on-surface"
        }">
          <span class="font-mono opacity-60">#</span>
          <span class="${active ? "font-bold" : ""}">${ch}</span>
        </button>`;
      ul.appendChild(li);
    });
  }

  function renderDmList() {
    const ul = document.getElementById("dm-list");
    ul.innerHTML = "";
    DMS.forEach((name) => {
      const key = `dm:${name}`;
      const active = activeKey === key;
      const li = document.createElement("li");
      li.innerHTML = `
        <button data-key="${key}" class="dm-btn w-full flex items-center gap-2 px-2 py-1.5 rounded text-left transition-colors ${
          active
            ? "bg-primary-container/20 text-primary border border-primary-container/30"
            : "text-on-surface-variant hover:bg-surface-variant hover:text-on-surface"
        }">
        </button>`;
      const btn = li.querySelector("button");
      const av = avatarEl(name, "w-6 h-6");
      av.classList.add("rounded-full", "text-[10px]", "shrink-0");
      btn.appendChild(av);
      const span = document.createElement("span");
      span.className = active ? "font-bold" : "";
      span.textContent = name;
      btn.appendChild(span);
      ul.appendChild(li);
    });
  }

  // ---------- Chat rendering ----------
  function renderChat() {
    const isDm = activeKey.startsWith("dm:");
    document.getElementById("chat-icon").textContent = isDm ? "" : "#";
    document.getElementById("chat-title").textContent = isDm ? activeKey.slice(3) : activeKey;

    const feed = document.getElementById("message-feed");
    feed.innerHTML = "";
    const msgs = store[activeKey] || [];

    if (msgs.length === 0) {
      const empty = document.createElement("div");
      empty.className = "text-on-surface-variant text-center mt-10";
      empty.textContent = "No messages yet — say hi.";
      feed.appendChild(empty);
    }

    msgs.forEach((m) => {
      const row = document.createElement("div");
      row.className = "flex gap-3";
      const av = avatarEl(m.user);
      row.appendChild(av);

      const body = document.createElement("div");
      body.className = "flex-1 min-w-0";
      body.innerHTML = `
        <div class="flex items-baseline gap-2 mb-0.5">
          <span class="font-bold text-on-surface">${m.user}</span>
          <span class="font-mono text-[11px] text-on-surface-variant">${m.time}</span>
        </div>
        <div class="text-on-surface break-words"></div>`;
      body.querySelector("div.text-on-surface.break-words").textContent = m.text;
      row.appendChild(body);
      feed.appendChild(row);
    });

    feed.scrollTop = feed.scrollHeight;
  }

  function setActive(key) {
    activeKey = key;
    renderChannelList();
    renderDmList();
    renderChat();
  }

  // ---------- Sending ----------
  function sendMessage() {
    const input = document.getElementById("message-input");
    const text = input.value.trim();
    if (!text) return;

    const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    if (!store[activeKey]) store[activeKey] = [];
    store[activeKey].push({ user: ME, text, time });
    saveStore(store);
    input.value = "";
    renderChat();
  }

  document.getElementById("send-btn").addEventListener("click", sendMessage);
  document.getElementById("message-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  document.addEventListener("click", (e) => {
    const btn = e.target.closest(".channel-btn, .dm-btn");
    if (btn) setActive(btn.dataset.key);
  });

  // ---------- Init ----------
  renderChannelList();
  renderDmList();
  renderChat();
</script>

<script>
  // Navbar active state: a section gets blue background only after it is clicked.
  const navbarItems = [
    "overview", "my-work", "projects", "boards", "sprints",
    "calendar", "inbox", "messages", "files", "analytics",
    "ai-assistant", "settings"
  ];

  navbarItems.forEach((item) => {
    const link = document.getElementById("nav-" + item);
    if (!link) return;

    link.addEventListener("click", (e) => {
      e.preventDefault();

      navbarItems.forEach((other) => {
        const el = document.getElementById("nav-" + other);
        if (!el) return;
        el.classList.remove("bg-[#08a9df]", "text-[#07151b]");
        el.classList.add("text-[#c5c5cf]", "hover:bg-[#24252a]");
      });

      link.classList.remove("text-[#c5c5cf]", "hover:bg-[#24252a]");
      link.classList.add("bg-[#08a9df]", "text-[#07151b]");
    });
  });
</script>

</body>
